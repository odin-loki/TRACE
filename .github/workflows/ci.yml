name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The configuration the README tells a newcomer to build.
          - name: release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          # Without -march=native the SIMD width changes, and with it the
          # random stream the particle filter consumes. Both paths are built
          # because both are shipped, and the numbers differ slightly between
          # them - see docs/VALIDATION.md, "Reproducing".
          - name: portable (no -march=native)
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DTRACE_NATIVE_ARCH=OFF
          # Scalar fallback: xsimd off, so the vectorised kernels compile out
          # and the scalar tails carry everything.
          - name: scalar (no xsimd)
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DTRACE_WITH_XSIMD=OFF
          # The flags are QUOTED. Unquoted, the folded scalar puts
          # `-fno-omit-frame-pointer` on the command line as a word of its own,
          # cmake answers "Unknown argument -fno-omit-frame-pointer" and exits
          # 1, and this entry has never got past Configure - so the sanitizer
          # coverage this matrix claims has never once run.
          - name: sanitizers
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      # UBSan warns and carries on unless told otherwise, so without
      # `halt_on_error` the sanitizer entry could report success on a run that
      # printed undefined behaviour to its own log. Leak detection was off for
      # every entry; it is the sanitizer entry's whole point, so it is on.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -j2

      # The engine's own headline demo, run to completion. It is deterministic
      # under a fixed seed on a given build, so a crash or a hang here is a real
      # regression rather than a flake.
      - name: Maze demo
        run: ./build/src/apps/trace_maze > /dev/null

      - name: All scenarios
        run: ./build/src/apps/trace_sim --all --seed 7 > /dev/null

  # The install path breaks in ways that are invisible from inside the tree:
  # the export took the raw target name and offered `TRACE::trace_core` while
  # every document says `TRACE::core`, and nothing in-tree could have noticed,
  # because in-tree the ALIAS exists. The only test that finds that is
  # consuming the package.
  install-and-consume:
    name: install, then consume from another project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      # TRACE_NATIVE_ARCH=OFF, because that is what the README tells anyone
      # installing this to do and CI should exercise the documented path.
      - name: Configure, build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRACE_NATIVE_ARCH=OFF \
            -DTRACE_BUILD_TESTS=OFF
          cmake --build build
          cmake --install build --prefix "$PWD/_install"

      - name: The package carries what it must
        run: |
          set -e
          test -f _install/lib/cmake/TRACE/TRACEConfig.cmake
          test -f _install/lib/cmake/TRACE/TRACEConfigVersion.cmake
          # AGPL section 4: the licence travels with the work. BSD-3: xsimd's
          # notice is reproduced in the distribution.
          test -f _install/share/doc/TRACE/LICENSE
          test -f _install/share/doc/TRACE/LICENSE.xsimd
          test -f _install/include/trace/core/engine.hpp
          # The exported name is the documented one, not the raw target name.
          grep -q 'TRACE::core' _install/lib/cmake/TRACE/TRACETargets.cmake

      - name: Consume it from a separate project
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(trace_consumer LANGUAGES CXX)
          find_package(TRACE REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE TRACE::core)
          EOF
          cat > main.cpp <<'EOF'
          #include "trace/backend/simd.hpp"
          #include "trace/core/engine.hpp"
          #include "trace/core/observation.hpp"
          #include "trace/core/profile.hpp"
          #include <cstdio>
          int main() {
              if (!trace::abi::compatible()) { std::puts("ABI mismatch"); return 1; }
              trace::EngineConfig cfg;
              cfg.profile = trace::CityCameraSurveillance();
              trace::Engine eng(cfg);
              int n = 0;
              for (int s = 0; s < 40; ++s) {
                  trace::Observation o;
                  o.source_id = "cam";
                  o.timestamp = s * cfg.profile.scan_dt_s;
                  o.position = trace::Vec2{1.4 * s, 0.0};
                  o.modality = trace::Modality::GEOINT;
                  o.confidence = 0.95;
                  n = eng.ingest({o}, s * cfg.profile.scan_dt_s).n_tracks;
              }
              std::printf("consumed: backend %s, %d track(s)\n",
                          trace::simd::backend_name(), n);
              return n > 0 ? 0 : 1;
          }
          EOF
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install"
          cmake --build build
          ./build/consumer

      - name: The ABI guard fires when it should
        run: |
          set -e
          # The guard has to be right when it says NO, and that is the case
          # nothing was testing. The library above is portable; this consumer
          # is built for AVX2, so xsimd gives it four lanes against the
          # library's two and `compatible()` must return false. It must do so
          # at -O0 as well as -O2: the first version of the guard folded the
          # comparison at -O2 and emitted a call at -O0, where the linker
          # resolved it to the consumer's own copy and the mismatch went
          # unreported. Debug is exactly where someone chasing this would look.
          cd /tmp/consumer
          for opt in -O0 -O2; do
            cmake -S . -B "build_mismatch$opt" -G Ninja               -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install"               -DCMAKE_CXX_FLAGS="-mavx2 $opt"
            cmake --build "build_mismatch$opt"
            if "./build_mismatch$opt/consumer"; then
              echo "FAIL ($opt): a four-lane consumer called a two-lane library compatible"
              exit 1
            fi
            echo "ok ($opt): mismatch reported"
          done

  proofs:
    name: bounded model checking
    runs-on: ubuntu-latest
    # No `continue-on-error` here. It used to sit on this whole job, on the
    # reasoning that ESBMC is not packaged so the suite cannot be complete -
    # but `run.sh` already reports an absent checker as SKIP and does not count
    # it, and exits non-zero ONLY on a harness that came back other than as its
    # manifest says. So the flag was not tolerating an expected gap, it was
    # discarding the job's entire verdict. It hid a real break within the hour:
    # the licensing pass rewrote run.sh through a temporary file and dropped its
    # executable bit, and this job went on reporting success against a script
    # that could not start.
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc
      # Checked separately so that "cannot start" is never mistaken for
      # "started and found nothing wrong".
      - name: The suite is runnable
        run: test -x verification/run.sh
      # Plain invocation: harnesses whose preferred checker is absent are
      # reported as SKIP and not counted, so the job checks what CBMC can
      # check without pretending to cover the rest. A harness the manifest
      # marks SLOW is not counted either, so a hosted runner being slower than
      # this one cannot turn the job red on its own.
      - name: Run the proof suite
        run: TIMEOUT=1500 ./verification/run.sh
