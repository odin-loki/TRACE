name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The configuration the README tells a newcomer to build.
          - name: release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          # Without -march=native the SIMD width changes, and with it the
          # random stream the particle filter consumes. Both paths are built
          # because both are shipped, and the numbers differ slightly between
          # them - see docs/VALIDATION.md, "Reproducing".
          - name: portable (no -march=native)
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DTRACE_NATIVE_ARCH=OFF
          # Scalar fallback: xsimd off, so the vectorised kernels compile out
          # and the scalar tails carry everything.
          - name: scalar (no xsimd)
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DTRACE_WITH_XSIMD=OFF
          # The flags are QUOTED. Unquoted, the folded scalar puts
          # `-fno-omit-frame-pointer` on the command line as a word of its own,
          # cmake answers "Unknown argument -fno-omit-frame-pointer" and exits
          # 1, and this entry has never got past Configure - so the sanitizer
          # coverage this matrix claims has never once run.
          - name: sanitizers
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      # UBSan warns and carries on unless told otherwise, so without
      # `halt_on_error` the sanitizer entry could report success on a run that
      # printed undefined behaviour to its own log. Leak detection was off for
      # every entry; it is the sanitizer entry's whole point, so it is on.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -j2

      # The engine's own headline demo, run to completion. It is deterministic
      # under a fixed seed on a given build, so a crash or a hang here is a real
      # regression rather than a flake.
      - name: Maze demo
        run: ./build/src/apps/trace_maze > /dev/null

      - name: All scenarios
        run: ./build/src/apps/trace_sim --all --seed 7 > /dev/null

  proofs:
    name: bounded model checking
    runs-on: ubuntu-latest
    # No `continue-on-error` here. It used to sit on this whole job, on the
    # reasoning that ESBMC is not packaged so the suite cannot be complete -
    # but `run.sh` already reports an absent checker as SKIP and does not count
    # it, and exits non-zero ONLY on a harness that came back other than as its
    # manifest says. So the flag was not tolerating an expected gap, it was
    # discarding the job's entire verdict. It hid a real break within the hour:
    # the licensing pass rewrote run.sh through a temporary file and dropped its
    # executable bit, and this job went on reporting success against a script
    # that could not start.
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc
      # Checked separately so that "cannot start" is never mistaken for
      # "started and found nothing wrong".
      - name: The suite is runnable
        run: test -x verification/run.sh
      # Plain invocation: harnesses whose preferred checker is absent are
      # reported as SKIP and not counted, so the job checks what CBMC can
      # check without pretending to cover the rest. A harness the manifest
      # marks SLOW is not counted either, so a hosted runner being slower than
      # this one cannot turn the job red on its own.
      - name: Run the proof suite
        run: TIMEOUT=1500 ./verification/run.sh
